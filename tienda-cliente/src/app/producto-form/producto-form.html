<form class="formulario" (ngSubmit)="enviar()">
  <h2>Nuevo producto</h2>
 
  <label>
    Nombre
    <input name="nombre" [(ngModel)]="nombre">
  </label>
 
  <label>
    Precio
    <input name="precio" type="number" step="0.01" [(ngModel)]="precio">
  </label>
 
  <label>
    Stock
    <input name="stock" type="number" [(ngModel)]="stock">
  </label>
 
  <label>
    Imagen
    <input name="imagen" [(ngModel)]="imagen" placeholder="/imagenes/mango.jpg">
  </label>
 
  <button type="submit">Guardar</button>
</form>
