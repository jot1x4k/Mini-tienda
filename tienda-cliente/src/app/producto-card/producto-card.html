<div class="tarjeta">
  <img [src]="producto().imagen" [alt]="producto().nombre" class="img-producto" />
  <h3>{{ producto().nombre }}</h3>
  @if (producto().descuento > 0) {
    <p class="tachado">Precio anterior: <s>${{ producto().precio }}</s></p>
    <p class="oferta">OFERTA -${{ producto().descuento }}%</p>
    <p class="oferta">Precio final: ${{ total() }}</p>
  } @else {
    <p>Precio: ${{ producto().precio }}</p>
  }

  @if (producto().stock > 0) {
    <p class="disponible">Stock: {{ producto().stock }}</p>
  } @else {
    <p class="agotado">Agotado</p>
  }

  <button (click)="alHacerClic()" [disabled]="producto().stock === 0">Comprar</button>

  <!-- NUEVO: acciones de administración -->
  <div class="acciones-admin">
    <button class="btn-secundario" (click)="reponer.emit(producto())">+5 stock</button>
    <button class="btn-peligro" (click)="eliminar.emit(producto().id)">Eliminar</button>
  </div>
</div>
