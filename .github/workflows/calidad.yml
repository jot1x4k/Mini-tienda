name: Calidad de la tienda
 
# Cuándo se ejecuta: en cada push a main y en cada pull request
on:
  push:
    branches: [ main ]
  pull_request:
 
jobs:
  # 1. Backend: pruebas unitarias, de integración y umbral de JaCoCo
  backend:
    name: Backend (JUnit + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tienda-api
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
 
      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw
 
      - name: Pruebas y umbral de cobertura
        run: ./mvnw -B verify
 
  # 2. Frontend: pruebas con Vitest y umbral de cobertura
  frontend:
    name: Frontend (Vitest + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tienda-cliente
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
 
      - name: Instalar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tienda-cliente/package-lock.json
 
      - name: Instalar dependencias
        run: npm ci
 
      - name: Pruebas y umbral de cobertura
        run: npx ng test --watch=false --coverage
 
  # 3. Punta a punta: solo si los dos anteriores pasaron
  e2e:
    name: Punta a punta (Playwright)
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
 
      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      - name: Instalar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tienda-cliente/package-lock.json
 
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x tienda-api/mvnw
 
      - name: Instalar dependencias del frontend
        working-directory: tienda-cliente
        run: npm ci
 
      - name: Instalar el navegador de Playwright
        working-directory: tienda-cliente
        run: npx playwright install --with-deps chromium
 
      - name: Pruebas de punta a punta
        working-directory: tienda-cliente
        run: npx playwright test
 
      - name: Guardar el informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: informe-playwright
          path: tienda-cliente/playwright-report/
          retention-days: 7
