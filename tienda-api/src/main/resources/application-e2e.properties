# Perfil e2e: se activa con -Dspring-boot.run.profiles=e2e
# Base de datos en MEMORIA: cada arranque empieza vacía y DatosIniciales
# vuelve a cargar las cuatro frutas. La carpeta data/ no se toca.
spring.datasource.url=jdbc:h2:mem:tienda-e2e
 
# La consola de H2 no hace falta durante las pruebas
spring.h2.console.enabled=false
 
# Menos texto en la terminal
spring.jpa.show-sql=false
