services:

  backend:
    build:
      context: ./tienda-api
      dockerfile: Dockerfile
    container_name: tienda-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - tienda-network

  frontend:
    build:
      context: ./tienda-cliente
      dockerfile: Dockerfile
    container_name: tienda-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tienda-network

networks:
  tienda-network:
    driver: bridge